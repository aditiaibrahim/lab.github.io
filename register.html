<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Laboratory Unit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .register-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            width: 100%;
            max-width: 500px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header h1 {
            color: #1e3a8a;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .register-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .btn-register {
            width: 100%;
            padding: 1rem;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-register:hover {
            background: #1e40af;
        }

        .btn-register:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        .register-footer {
            text-align: center;
            margin-top: 2rem;
            color: #666;
        }

        .register-footer a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 600;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .back-home a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 500;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #1e3a8a;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #1e3a8a;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke Home</a>
        </div>

        <div class="register-header">
            <h1>Daftar Akun</h1>
            <p>Buat akun Laboratory Unit</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i> Akun akan diverifikasi oleh admin sebelum dapat digunakan.
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="nama@nusaputra.ac.id">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Minimal 6 karakter" minlength="6">
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="">Pilih Role</option>
                    <option value="mahasiswa">Mahasiswa</option>
                    <option value="dosen">Dosen</option>
                </select>
            </div>

            <div class="form-group">
                <label for="npm_nidn">NPM/NIDN</label>
                <input type="text" id="npm_nidn" name="npm_nidn" placeholder="Masukkan NPM atau NIDN">
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <span id="registerText">Daftar</span>
            </button>
        </form>

        <div class="register-footer">
            <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const alertDiv = document.getElementById('alert');
        const registerBtn = document.getElementById('registerBtn');
        const registerText = document.getElementById('registerText');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const npm_nidn = document.getElementById('npm_nidn').value;

            // Show loading state
            registerBtn.disabled = true;
            registerText.textContent = 'Mendaftar...';
            alertDiv.className = 'alert';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nama, email, password, role, npm_nidn }),
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message + ' Silakan login untuk melanjutkan.', 'success');
                    registerForm.reset();

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Registrasi gagal', 'error');
                    registerBtn.disabled = false;
                    registerText.textContent = 'Daftar';
                }
            } catch (error) {
                console.error('Register error:', error);
                showAlert('Server error. Silakan coba lagi.', 'error');
                registerBtn.disabled = false;
                registerText.textContent = 'Daftar';
            }
        });

        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type} show`;
        }

        // Check if already logged in
        const token = localStorage.getItem('token');
        if (token) {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user.role === 'admin') {
                window.location.href = 'dashboard/admin.html';
            } else if (user.role === 'dosen') {
                window.location.href = 'dashboard/dosen.html';
            } else {
                window.location.href = 'dashboard/mahasiswa.html';
            }
        }
    </script>
</body>
</html>
